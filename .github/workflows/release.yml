name: Release

# The pushed tag is the library's release: Go modules have no registry, and
# pkg.go.dev indexes the tag on its own. This workflow tests the tag, then
# GoReleaser builds the urlpipe CLI for macOS, Linux and Windows, creates the
# GitHub Release with the archives, and updates the Homebrew tap and the Scoop
# bucket (see .goreleaser.yaml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
      - name: Ask pkg.go.dev to index the tag
        run: curl -fsS "https://proxy.golang.org/github.com/!u!r!lpipe/urlpipe-go/@v/${GITHUB_REF_NAME}.info" || true
