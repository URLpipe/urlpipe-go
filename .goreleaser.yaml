# Releases the urlpipe CLI (cmd/urlpipe) when a v* tag is pushed; see
# .github/workflows/release.yml. The Go library itself needs no build: the tag
# is its release, and pkg.go.dev indexes it.
version: 2

project_name: urlpipe

builds:
  - id: urlpipe
    main: ./cmd/urlpipe
    binary: urlpipe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: urlpipe
    name_template: "urlpipe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "

homebrew_casks:
  - name: urlpipe
    binaries: [urlpipe]
    homepage: https://urlpipe.dev
    description: "Turn any URL into Markdown, screenshots, metadata or a Lighthouse audit, from the terminal."
    license: MIT
    directory: Casks
    commit_author:
      name: urlpipe-release
      email: contact@urlpipe.dev
    commit_msg_template: "urlpipe {{ .Tag }}"
    repository:
      owner: URLpipe
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:URLpipe/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    # The binaries aren't notarized, so macOS would quarantine them and refuse
    # to run them; the cask clears that flag after installing.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/urlpipe"]
          end

scoops:
  - name: urlpipe
    homepage: https://urlpipe.dev
    description: "Turn any URL into Markdown, screenshots, metadata or a Lighthouse audit, from the terminal."
    license: MIT
    directory: bucket
    commit_author:
      name: urlpipe-release
      email: contact@urlpipe.dev
    commit_msg_template: "urlpipe {{ .Tag }}"
    repository:
      owner: URLpipe
      name: scoop-bucket
      branch: main
      git:
        url: git@github.com:URLpipe/scoop-bucket.git
        private_key: "{{ .Env.SCOOP_BUCKET_DEPLOY_KEY }}"
